version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only (ADR-0009).
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Types track the oldest supported Node (22), so newer APIs fail to type-check.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # marked is pinned to the version the Claude Code binary bundles, not npm's latest (reference §2.1).
      - dependency-name: marked
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
