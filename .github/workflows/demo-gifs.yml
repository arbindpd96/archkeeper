name: Demo GIFs

# Renders every tape not marked live against the packed CLI and uploads the GIFs as the demo-gifs
# artifact. It never commits: the maintainer copies them with npm run gifs:pull -- <run-id>.
on:
  pull_request:
    paths:
      - 'docs/media/tapes/**'
      - 'src/**'
      - 'modules/**'
      - 'examples/**'
      - 'scripts/render-tapes.mjs'
      - 'scripts/check-demos.mjs'
      - '.github/workflows/demo-gifs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  render:
    name: Render demo GIFs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The version must equal VHS_VERSION in scripts/render-tapes.mjs, which refuses any other.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.12.1
      - name: Render every tape not marked live against the packed CLI
        run: node scripts/render-tapes.mjs --out "$RUNNER_TEMP/demo-gifs"
      - name: Size and duration caps
        run: node scripts/check-demos.mjs "$RUNNER_TEMP/demo-gifs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: demo-gifs
          path: ${{ runner.temp }}/demo-gifs/*.gif
          if-no-files-found: warn
          retention-days: 30
