name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Formatting
        run: npm run format:check
      - name: Lint (readability, complexity, JSDoc)
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Comment policy
        run: npm run comments
      - name: Brand (slug only in src/core/brand.ts)
        run: npm run brand
      - name: Schemas (schema/*.json match the zod schemas in src/core)
        run: npm run schema:check
      - name: Demo GIFs (2 MB, 20 s or 30 s for the hero, each from a tape)
        run: npm run demos
      - name: Tests
        run: npm test

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build here and in a fresh copy elsewhere, then compare sha256 sums
        run: |
          checksums() { (cd "$1/dist" && find . -type f -print0 | sort -z | xargs -0 sha256sum); }
          npm run build
          checksums . > "$RUNNER_TEMP/first.sha256"
          rebuild="$RUNNER_TEMP/rebuild elsewhere"
          mkdir -p "$rebuild"
          git archive --format=tar --output "$RUNNER_TEMP/source.tar" HEAD
          tar -xf "$RUNNER_TEMP/source.tar" -C "$rebuild"
          (cd "$rebuild" && npm ci --ignore-scripts && npm run build)
          checksums "$rebuild" > "$RUNNER_TEMP/second.sha256"
          cat "$RUNNER_TEMP/first.sha256"
          diff "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"

  node-gate:
    name: Node.js gate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '18', expect: reject }
          - { node: '20', expect: reject }
          - { node: '22.17.0', expect: reject }
          - { node: '23', expect: reject }
          - { node: '22.17.1', expect: run }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run the built bin
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          node --version
          if printed="$(node dist/cli.mjs --version 2>&1)"; then status=0; else status=$?; fi
          echo "exit $status: $printed"
          if [ "$EXPECT" = reject ]; then
            test "$status" = 1
            grep -q 'needs Node.js' <<< "$printed"
          else
            test "$status" = 0
            test "$printed" = "$(node -p "require('./package.json').version")"
          fi

  package:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Integrity and lightness budgets (publint, pack snapshot, budgets.json)
        run: npm run package
      - name: Publish dry run
        # An explicit tag keeps the dry run independent of what is on npm (the name holds a 0.0.1 placeholder).
        run: npm publish --dry-run --ignore-scripts --tag ci-dry-run

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      # The same steps as release.yml, without a token: the release guards report rather than enforce,
      # and npm stage publish runs with --dry-run on the packed tarball.
      - name: Release guards (dry run)
        id: guards
        run: node scripts/check-release.mjs --dry-run
      - name: Check whether this version is already on npm
        id: registry
        env:
          SPEC: ${{ steps.guards.outputs.name }}@${{ steps.guards.outputs.version }}
          VERSION: ${{ steps.guards.outputs.version }}
        run: |
          if [ "$(npm view "$SPEC" version 2>/dev/null)" = "$VERSION" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Strip dev-only lifecycle scripts, as a release does
        run: npm pkg delete scripts.prepare
      - run: npm run build
      - name: Package checks on the stripped manifest
        run: npm run package -- --release
      - name: Pack the commit (only prepare removed)
        id: pack
        run: node scripts/pack-release.mjs "$RUNNER_TEMP/release"
      # A version already on npm would only be verified by a release, and npm refuses even a dry run of it.
      - name: Stage publish dry run (with the explicit dist-tag a release passes)
        if: steps.registry.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.guards.outputs.dist-tag }}
          TARBALL: ${{ runner.temp }}/release/${{ steps.pack.outputs.tarball }}
        run: |
          npm stage publish "$TARBALL" --dry-run --access public --ignore-scripts --json --tag "$DIST_TAG" > "$RUNNER_TEMP/stage.json"
          node scripts/stage-summary.mjs "$RUNNER_TEMP/stage.json" --dist-tag "$DIST_TAG" --dry-run

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install the packed tarball under a path with a space and run the bin
        shell: bash
        run: |
          smoke="${RUNNER_TEMP//\\//}/install smoke"
          mkdir -p "$smoke/project"
          tarball="$(npm pack --ignore-scripts --json --pack-destination "$smoke" | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8'))[0].filename")"
          bin="$(node -p "Object.keys(require('./package.json').bin)[0]")"
          version="$(node -p "require('./package.json').version")"
          cd "$smoke/project"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$smoke/$tarball"
          printed="$(npx --no-install "$bin" --version)"
          echo "$bin --version printed $printed"
          test "$printed" = "$version"

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --verbose --from "$BASE_SHA" --to "$HEAD_SHA"

  commit-authors:
    name: Commit authors
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The script is dependency-free, so this job installs nothing.
      - name: No bot authors (Dependabot only on its own PRs) and no AI attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-commit-authors.mjs "$BASE_SHA" "$HEAD_SHA"

  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Labels are read live rather than from the event, so re-running the job after adding no-release
      # sees the label. Only this step holds the token; the PR's own script runs without it.
      - name: Read the pull request labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' > "$RUNNER_TEMP/pr-labels.txt"
      # The script is dependency-free, so this job installs nothing.
      - name: Require a changeset for changes to published folders unless labelled no-release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PR_LABELS="$(cat "$RUNNER_TEMP/pr-labels.txt")"
          export PR_LABELS
          node scripts/check-changeset.mjs "$BASE_SHA" "$HEAD_SHA"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  ci-ok:
    name: CI passed
    if: always()
    needs:
      - quality
      - test
      - reproducible-build
      - node-gate
      - package
      - release-dry-run
      - install-smoke
      - commits
      - commit-authors
      - changeset
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed."
